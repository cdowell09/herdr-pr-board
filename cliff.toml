# git-cliff configuration for PR Board.
# See https://git-cliff.org/docs/configuration.

[changelog]
header = """# Changelog

This file lists notable changes to PR Board."""
body = """

{% if version %}## {{ version | trim_start_matches(pat=\"v\") }} - {{ timestamp | date(format=\"%Y-%m-%d\") }}{% else %}## Unreleased{% endif %}

{% if message and message is containing(\"### Highlights\") %}{{ message | trim }}

<details>
<summary>Full changelog</summary>

{% endif %}{% for group, commits in commits | group_by(attribute=\"group\") %}### {{ group | striptags | trim | upper_first }}

{% for commit in commits %}- {{ commit.message | upper_first }}
{% endfor %}{% if not loop.last %}
{% endif %}{% endfor %}{% if message and message is containing(\"### Highlights\") %}
</details>
{% endif %}"""
trim = false

[git]
conventional_commits = true
filter_unconventional = false
sort_commits = "oldest"
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+$"

commit_parsers = [
    { message = "^chore\\(release\\):", skip = true },
    { message = "^feat", group = "Features" },
    { message = "^fix", group = "Bug Fixes" },
    { message = "^docs?", group = "Documentation" },
    { message = "^perf", group = "Performance" },
    { message = "^refactor", group = "Refactoring" },
    { message = "^test", group = "Testing" },
    { message = "^chore|^ci", group = "Maintenance" },
    { message = "^revert", group = "Reverts" },
    { message = ".*", group = "Other" },
]
