id = "cdowell09.pr-board"
name = "PR Board"
version = "0.8.0"
min_herdr_version = "0.8.0"
description = "Cross-repository GitHub pull request dashboard with CI status and configurable agent reviews."
platforms = ["macos", "linux", "windows"]

[[build]]
platforms = ["macos", "linux"]
command = ["go", "build", "-o", "bin/herdr-pr-board", "./cmd/herdr-pr-board"]

[[build]]
platforms = ["windows"]
command = ["go", "build", "-o", "bin/herdr-pr-board.exe", "./cmd/herdr-pr-board"]

[[actions]]
id = "open"
title = "Open PR board"
contexts = ["workspace"]
command = ["bin/herdr-pr-board", "--plugin-action", "open"]

# Herdr 0.8 on macOS and Linux resolves pane commands through PATH only, so
# Unix panes start through the bash wrapper. Windows panes resolve relative
# commands from the plugin root and run the binary directly.
[[panes]]
id = "board"
title = "PR Board"
placement = "tab"
platforms = ["macos", "linux"]
command = ["bash", "bin/run"]

[[panes]]
id = "board-windows"
title = "PR Board"
placement = "tab"
platforms = ["windows"]
command = ["bin/herdr-pr-board.exe", "--plugin-action", "run"]
