name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        run: |
          files="$(gofmt -l cmd internal)"
          if [ -n "$files" ]; then
            echo "These files need formatting. Run 'gofmt -w cmd internal'." >&2
            echo "$files" >&2
            exit 1
          fi
      - name: Check whitespace
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          if [ -n "$PR_BASE" ] && [ -n "$PR_HEAD" ]; then
            git diff --check "$PR_BASE...$PR_HEAD"
          else
            git diff --check "$PUSH_BEFORE...$PUSH_AFTER"
          fi
      - name: Test
        run: go test ./...
      - name: Race test
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build -o bin/herdr-pr-board ./cmd/herdr-pr-board
      - name: Validate shell scripts
        run: bash -n bin/open bin/run
