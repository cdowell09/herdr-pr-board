name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      build-matrix: ${{ steps.platforms.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Read manifest platforms
        id: platforms
        run: |
          matrix="$(go run ./cmd/ci-platform-matrix herdr-plugin.toml)"
          printf 'matrix=%s\n' "$matrix" >>"$GITHUB_OUTPUT"
      - name: Check formatting
        run: |
          files="$(gofmt -l cmd internal)"
          if [ -n "$files" ]; then
            echo "These files need formatting. Run 'gofmt -w cmd internal'." >&2
            echo "$files" >&2
            exit 1
          fi
      - name: Check whitespace
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          if [ -n "$PR_BASE" ] && [ -n "$PR_HEAD" ]; then
            git diff --check "$PR_BASE...$PR_HEAD"
          else
            git diff --check "$PUSH_BEFORE...$PUSH_AFTER"
          fi
      - name: Test
        run: go test ./...
      - name: Validate changelog generation
        uses: orhun/git-cliff-action@3d96a18cc4ec17e9dc69ddcc424ccafaf1f78ce2 # v4
        with:
          version: v2.13.1
          config: cliff.toml
          args: --unreleased --strip header --offline
        env:
          OUTPUT: ${{ runner.temp }}/changelog-preview.md
      - name: Test release validation
        run: |
          export PATH="$RUNNER_TEMP/git-cliff/bin:$PATH"
          command -v git-cliff
          python3 -B -m unittest discover -s scripts -p '*_test.py'
      - name: Race test
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.6.1 ./...
      - name: Validate shell scripts
        run: bash -n bin/open bin/run

  build:
    name: Build (${{ matrix.platform }})
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.test.outputs.build-matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build command
        env:
          CGO_ENABLED: 0
          GOARCH: amd64
          GOOS: ${{ matrix.goos }}
        run: go build -o "bin/herdr-pr-board-${{ matrix.platform }}" ./cmd/herdr-pr-board

  windows-native:
    name: Windows native behavior
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Test native Windows behavior
        run: go test -race ./...
      - name: Build native command
        run: go build -o bin/herdr-pr-board.exe ./cmd/herdr-pr-board
      - name: Exercise native Herdr installation and panes
        run: python -B scripts/windows_herdr_smoke.py
