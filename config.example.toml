[ui]
title = "Pull Requests"

[github]
# 0 disables automatic refresh. Otherwise use a Go duration (5m, 1h, etc.).
# The headless monitor also uses this interval.
refresh_interval = "5m"
# GitHub Search returns at most 1,000 results per query.
limit_per_scope = 100
# Bounds simultaneous Search API calls.
max_concurrency = 4
# Number of PRs enriched with aggregate CI status in each GraphQL query.
ci_batch_size = 25
# Applied to views with scope = "configured". @me resolves through `gh api user`.
scopes = [
  "user:@me",
  # "org:your-company",
  # "repo:owner/repository",
]

[sidebar]
# Report PR counts into Herdr sidebar tokens after each full refresh.
# Add $prs_open, $prs_review, and $prs_ci to [ui.sidebar.spaces] rows in
# ~/.config/herdr/config.toml to display them in the workspace running the board.
# The board never adds GitHub requests for reporting; it reuses the refresh snapshot.
enabled = true
# Tokens expire this long after the last report. When the board is closed,
# the sidebar row disappears. 0 keeps tokens until the next report.
ttl = "15m"
# The view whose PR count reports as $prs_review. When a view with this ID
# does not exist, the $prs_review token is omitted.
review_view = "review"

[[views]]
id = "authored"
title = "Opened by me"
query = "is:open author:@me"
scope = "global"

[[views]]
id = "review"
title = "Review requested"
query = "is:open review-requested:@me"
scope = "global"

[[views]]
id = "all"
title = "All open"
query = "is:open"
scope = "configured"

# Add any GitHub pull-request search as a custom view.
# [[views]]
# id = "frontend"
# title = "Frontend queue"
# query = 'is:open label:"frontend" -is:draft'
# scope = "configured"

[review]
# Select existing view IDs for automatic reviews. An empty list disables dispatch.
# The repository panel edits this global selection for all opted-in repositories.
# Start the monitor separately. New selections can wait until its next scan.
auto_views = []
# Share this concurrency limit across processes that use the same state directory.
max_concurrency = 1
# Include queue time and reviewer execution time in this limit.
timeout = "30m"

# Reuse each reviewer across repositories.
# Use an absolute program path or a program on PATH.
# [[reviewers]]
# id = "pi"
# command = ["/absolute/path/to/herdr-pr-board", "--pi-reviewer"]
#
# [[repositories]]
# name = "owner/repository"
# reviewer = "pi"

# Keep automatic launches disabled until you explicitly enable them.
# auto_launch = false
# Allow each publication action separately. An empty list keeps findings local.
# publish_actions = []
# Valid actions: "comment", "approve", "request_changes".
# Select one allowed action for automatic publication. Empty keeps findings local.
# Comment permission alone does not enable automatic posting.
# auto_publish = ""
